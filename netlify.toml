"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# MiniMe on Netlify. The app is apps/web (Next.js).
# Setup and cutover steps: deploy/NETLIFY.md.

[build]
  # npm workspaces: installing from apps/web installs the whole workspace from
  # the root lockfile, which is what next.config.js's outputFileTracingRoot
  # expects.
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # apps/web/netlify/functions — holds cron-dispatch, which replaces the
  # "crons" block of apps/web/vercel.json on this host.
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Netlify's Next.js runtime: turns the routes and API handlers into a server
# function. It has to be listed. A site linked through the Netlify dashboard
# gets it added automatically, but a deploy made by upload does not, and then
# the build "succeeds" by publishing .next as static files with every page and
# API route answering 404. No version is pinned and it is not in package.json,
# so each build uses Netlify's current release.
[[plugins]]
  package = "@netlify/plugin-nextjs"
